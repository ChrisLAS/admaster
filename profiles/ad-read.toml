# Extracted from the approved natural-speed reference. Change intentionally.
version = 1
name = "ad-read"

[render]
sample_rate = 44100
channels = 1
bits = 24
lufs = -19.0
lufs_tolerance = 0.5
true_peak_db = -1.3
true_peak_max_db = -1.0
duration_tolerance_samples = 1

[eq]
highpass_hz = 55.0
body_hz = 440.0
body_db = -1.25
body_bandwidth_octaves = 1.4
presence_hz = 2500.0
presence_db = 0.7
presence_bandwidth_octaves = 1.5

[compressor]
threshold_db = -25.0
ratio = 2.0
attack_ms = 15.0
release_ms = 120.0
rms_ms = 5.0
knee_db = 6.0
detector_highpass_hz = 90.0

[limiter]
true_peak = true
release_normalized = 0.354813389233575

[gain]
# Starting point from reference; output trim is source-dependent.
initial_db = 11.92
minimum_db = -6.0
maximum_db = 18.0
max_correction_db = 6.0
# Measured slope/bracket search, with early stall detection (not blind retries).
max_passes = 8

[timing]
# The approved reference rejected even 2.35% stretching. Never stretch by default.
max_stretch_percent = 0.0
quiet_db = -50.0
minimum_gap_seconds = 0.33
minimum_retained_gap_seconds = 0.20
maximum_gap_reduction_fraction = 0.65
crossfade_seconds = 0.008
head_room_seconds = 0.04
tail_room_seconds = 0.12
maximum_edge_trim_seconds = 3.0
maximum_total_reduction_fraction = 0.12
maximum_cuts_per_minute = 24
# Recover a short trimmed word tail only near the end of the same source.
recover_tail_seconds = 0.14
recover_tail_source_margin_seconds = 0.5
fade_in_seconds = 0.005
fade_out_seconds = 0.060

[quality]
minimum_speech_to_cut_threshold_db = 20.0
maximum_silence_fraction = 0.65
maximum_peak_plateau_seconds = 0.01
# Diagnostic, not a claim that a threshold can prove an inaudible edit.
maximum_boundary_step_db = -30.0
maximum_limiter_reduction_db = 6.0
maximum_heavy_limiting_fraction = 0.02
